<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LibreFly - Login</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Reset and Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', Courier, monospace; /* Monospaced font for a nerdy look */
            background-color: #2e3440; /* Dark background for minimal aesthetic */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            padding: 20px;
            background: linear-gradient(to bottom right, #2e3440, #3b4252); /* Soft gradient */
        }

        .container {
            background-color: #434c5e; /* Slightly lighter shade for the container */
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
        }

        h2 {
            text-align: center;
            color: #eceff4; /* Soft light color for header */
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        input[type="text"],
        input[type="password"] {
            padding: 15px;
            font-size: 16px;
            border: 1px solid #d8dee9; /* Light border color for inputs */
            border-radius: 8px;
            background-color: #3b4252;
            color: #eceff4;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        input:focus {
            border-color: #88c0d0; /* Soft blue for focus */
            box-shadow: 0 0 5px rgba(136, 192, 208, 0.5);
            outline: none;
        }

        .btn {
            background-color: #88c0d0; /* Soft blue button */
            color: #2e3440;
            padding: 15px;
            font-size: 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.2s;
        }

        .btn:hover {
            background-color: #81a1c1; /* Slightly darker blue on hover */
            transform: translateY(-2px);
        }

        .btn:active {
            transform: translateY(0);
        }

        .register-link {
            text-align: center;
            font-size: 14px;
            color: #eceff4;
            margin-top: 15px;
        }

        .register-link a {
            color: #88c0d0;
            text-decoration: none;
            font-weight: bold;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

        /* Responsive Design */
        @media (max-width: 480px) {
            .container {
                padding: 30px 20px;
            }

            h2 {
                font-size: 24px;
            }

            .btn {
                font-size: 16px;
                padding: 12px;
            }
        }

        /* For Tablets */
        @media (max-width: 768px) {
            h2 {
                font-size: 26px;
            }

            .btn {
                font-size: 17px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Login to Your Account</h2>

        <!-- Updated Form to Submit to login.php -->
        <form action="login.php" method="POST">
            <input type="text" name="email" placeholder="Email" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit" class="btn w-100">Login</button>
        </form>
        
        <div class="register-link">
            <p>Don't have an account? <a href="register.html">Register here</a></p>
        </div>
    </div>

    <!-- Bootstrap JS (Optional for extra interactivity) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
